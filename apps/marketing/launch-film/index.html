<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OpenPost launch film</title>
		<link rel="icon" href="data:," />
		<style>
			@font-face {
				font-family: 'Geist';
				src: url('/assets/brand/fonts/Geist-Regular.ttf');
				font-weight: 400;
			}
			@font-face {
				font-family: 'Geist';
				src: url('/assets/brand/fonts/Geist-SemiBold.ttf');
				font-weight: 600;
			}
			@font-face {
				font-family: 'Manrope';
				src: url('/assets/brand/fonts/Manrope-Variable.ttf');
				font-weight: 200 800;
			}

			:root {
				--canvas: #110d0b;
				--surface: #1a1411;
				--raised: #241b17;
				--ink: #f6efe9;
				--muted: #a4968c;
				--faint: #6f625a;
				--accent: #fd975d;
				--accent-ink: #2a1206;
				--line: rgb(255 255 255 / 9%);
				--line-strong: rgb(255 255 255 / 16%);
				--green: #6fcf8e;
				--red: #f07167;
				--amber: #f2b45a;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				background: #000;
			}

			#stage {
				position: relative;
				width: 1920px;
				height: 1080px;
				overflow: hidden;
				background: var(--canvas);
				color: var(--ink);
				font-family: 'Geist', sans-serif;
				-webkit-font-smoothing: antialiased;
				perspective: 2200px;
			}

			.layer {
				position: absolute;
				inset: 0;
				transform-origin: 960px 620px;
			}

			.box {
				position: absolute;
				transform-origin: 50% 50%;
			}

			#glow {
				position: absolute;
				left: 0;
				top: 0;
				width: 480px;
				height: 270px;
				transform: scale(4);
				transform-origin: 0 0;
				image-rendering: pixelated;
			}

			.icon {
				width: 1em;
				height: 1em;
				flex: none;
			}

			/* Kinetic titles: one line, centred on the title row. */
			.title {
				left: 0;
				width: 1920px;
				text-align: center;
				font-weight: 600;
				font-size: 76px;
				line-height: 1.1;
				letter-spacing: -0.035em;
				white-space: nowrap;
			}
			.word {
				display: inline-block;
				overflow: hidden;
				vertical-align: top;
				padding: 0 0.05em 0.14em;
				margin: 0 -0.05em -0.14em;
			}
			.word > span {
				display: inline-block;
			}
			.accent {
				color: var(--accent);
			}

			.hero {
				font-weight: 600;
				font-size: 104px;
				letter-spacing: -0.04em;
				white-space: nowrap;
				transform-origin: 0 0;
			}
			.caret {
				display: inline-block;
				width: 0.06em;
				height: 0.9em;
				margin-left: 0.04em;
				vertical-align: -0.08em;
				background: var(--accent);
			}

			/* Surfaces. */
			.panel {
				border-radius: 28px;
				background: var(--surface);
				border: 1px solid var(--line);
				box-shadow: 0 50px 120px rgb(0 0 0 / 55%);
			}
			.row {
				display: flex;
				align-items: center;
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				height: 60px;
				padding: 0 20px 0 9px;
				border-radius: 999px;
				background: var(--raised);
				border: 1px solid var(--line);
				font-size: 24px;
				font-weight: 600;
				white-space: nowrap;
			}
			.avatar {
				position: relative;
				width: 42px;
				height: 42px;
				flex: none;
			}
			.avatar > img:first-child {
				width: 42px;
				height: 42px;
				border-radius: 50%;
			}
			.avatar > img:last-child {
				position: absolute;
				right: -5px;
				bottom: -5px;
				width: 22px;
				height: 22px;
				border-radius: 6px;
				box-shadow: 0 0 0 2px var(--raised);
			}
			.tool {
				color: var(--muted);
				font-size: 34px;
			}
			.button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				height: 60px;
				padding: 0 28px;
				border-radius: 14px;
				color: var(--accent-ink);
				font-size: 24px;
				font-weight: 600;
				background-color: var(--accent);
				background-image: var(--dither);
				background-size: 8px 100%;
			}
			.counter {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				color: var(--muted);
				font-size: 24px;
				font-variant-numeric: tabular-nums;
			}

			/* Network cards. */
			.network {
				border-radius: 24px;
				overflow: hidden;
				border: 1px solid var(--line-strong);
				box-shadow: 0 40px 90px rgb(0 0 0 / 55%);
				padding: 22px;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}
			.network .head {
				display: flex;
				align-items: center;
				gap: 12px;
				font-size: 19px;
			}
			.network .head img.mark {
				width: 40px;
				height: 40px;
				border-radius: 10px;
			}
			.network .head img.face {
				width: 44px;
				height: 44px;
				border-radius: 50%;
			}
			.network .name {
				font-weight: 600;
			}
			.network .handle {
				color: rgb(255 255 255 / 50%);
			}
			.network .body {
				font-size: 20px;
				line-height: 1.4;
			}
			.network .media {
				height: 154px;
				border-radius: 14px;
				overflow: hidden;
				position: relative;
				flex: none;
			}
			.network .foot {
				margin-top: auto;
				display: flex;
				align-items: center;
				justify-content: space-between;
				color: rgb(255 255 255 / 55%);
				font-size: 24px;
			}
			.network .limit {
				font-size: 18px;
				font-variant-numeric: tabular-nums;
				padding: 6px 12px;
				border-radius: 999px;
				background: rgb(255 255 255 / 8%);
				color: rgb(255 255 255 / 75%);
			}

			/* Artwork: the launch image the film designs, built at 960x540 and scaled. */
			.art {
				position: absolute;
				left: 0;
				top: 0;
				width: 960px;
				height: 540px;
				transform-origin: 0 0;
				overflow: hidden;
				background: #1d130e;
			}
			.art .bg {
				position: absolute;
				inset: 0;
				width: 960px;
				height: 540px;
				image-rendering: pixelated;
			}
			.art .headline {
				position: absolute;
				left: 72px;
				top: 150px;
				font-family: 'Manrope', sans-serif;
				font-weight: 700;
				font-size: 132px;
				letter-spacing: -0.05em;
				line-height: 1;
				transform-origin: 0 50%;
			}
			.art .tag {
				position: absolute;
				left: 78px;
				top: 316px;
				font-size: 40px;
				font-weight: 600;
				color: rgb(255 255 255 / 78%);
			}
			.art .sticker {
				position: absolute;
				left: 720px;
				top: 290px;
				width: 180px;
				height: 180px;
			}
			.selection {
				position: absolute;
				border: 2px solid var(--accent);
			}
			.selection i {
				position: absolute;
				width: 14px;
				height: 14px;
				background: var(--ink);
				border: 2px solid var(--accent);
				border-radius: 3px;
			}

			/* Editors. */
			.rail {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 34px;
				padding-top: 34px;
				color: var(--muted);
				font-size: 30px;
			}
			.layer-row {
				display: flex;
				align-items: center;
				gap: 14px;
				height: 58px;
				padding: 0 16px;
				border-radius: 12px;
				font-size: 21px;
				color: var(--ink);
			}
			.swatch {
				width: 44px;
				height: 44px;
				border-radius: 12px;
				border: 2px solid var(--line-strong);
			}
			.track {
				height: 64px;
				border-radius: 12px;
				background: rgb(255 255 255 / 4%);
				border: 1px solid var(--line);
				position: absolute;
				overflow: hidden;
			}
			.clip {
				position: absolute;
				top: 6px;
				height: 52px;
				border-radius: 9px;
				overflow: hidden;
				font-size: 17px;
				font-weight: 600;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 12px;
				white-space: nowrap;
			}
			.caption-word {
				display: inline-block;
				padding: 4px 12px;
				margin: 0 3px;
				border-radius: 8px;
				background: rgb(0 0 0 / 72%);
				font-size: 26px;
				font-weight: 600;
			}

			/* Calendar. */
			.day-head {
				text-align: center;
				font-size: 20px;
				color: var(--muted);
			}
			.day-head b {
				display: block;
				font-size: 30px;
				color: var(--ink);
				font-weight: 600;
			}
			.chip {
				border-radius: 16px;
				background: var(--raised);
				border: 1px solid var(--line-strong);
				box-shadow: 0 18px 40px rgb(0 0 0 / 45%);
				padding: 10px;
				display: flex;
				flex-direction: column;
				gap: 8px;
				overflow: hidden;
			}
			.chip .thumb {
				height: 92px;
				border-radius: 10px;
				position: relative;
				overflow: hidden;
				flex: none;
			}
			.chip .label {
				font-size: 17px;
				font-weight: 600;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.chip .meta {
				display: flex;
				align-items: center;
				justify-content: space-between;
				font-size: 15px;
				color: var(--muted);
			}
			.chip .marks {
				display: flex;
				gap: 4px;
			}
			.chip .marks img {
				width: 18px;
				height: 18px;
				border-radius: 5px;
			}
			.status {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-weight: 600;
			}
			.status i {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: currentColor;
			}

			/* Results. */
			.stat {
				padding: 28px 32px;
			}
			.stat .k {
				font-size: 22px;
				color: var(--muted);
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.stat .v {
				margin-top: 10px;
				font-size: 64px;
				font-weight: 600;
				letter-spacing: -0.03em;
				font-variant-numeric: tabular-nums;
			}
			.bar {
				position: absolute;
				bottom: 0;
				border-radius: 8px 8px 2px 2px;
				transform-origin: 50% 100%;
			}
			.message {
				display: flex;
				gap: 18px;
				padding: 20px 26px;
				align-items: flex-start;
			}
			.message img.mark {
				width: 42px;
				height: 42px;
				border-radius: 11px;
			}
			.message .who {
				font-size: 20px;
				color: var(--muted);
			}
			.message .who b {
				color: var(--ink);
				font-weight: 600;
				margin-right: 8px;
			}
			.message .text {
				font-size: 26px;
				margin-top: 6px;
			}

			/* Feature roll and end card. */
			.feature-word {
				left: 0;
				width: 1920px;
				text-align: center;
				font-weight: 600;
				font-size: 150px;
				letter-spacing: -0.05em;
				white-space: nowrap;
			}
			.mark path {
				fill: var(--accent);
			}
			.wordmark {
				font-family: 'Manrope', sans-serif;
				font-weight: 600;
				font-size: 150px;
				letter-spacing: -0.04em;
				line-height: 1;
			}
			.closing {
				left: 0;
				width: 1920px;
				text-align: center;
			}
			.url {
				font-size: 56px;
				font-weight: 600;
				color: var(--accent);
			}
			.line {
				font-size: 34px;
				color: var(--muted);
			}
			.cursor {
				width: 46px;
				height: 46px;
				filter: drop-shadow(0 6px 10px rgb(0 0 0 / 50%));
			}
			.label {
				position: absolute;
				right: 48px;
				bottom: 36px;
				font-size: 17px;
				color: rgb(255 255 255 / 40%);
			}
		</style>
	</head>
	<body>
		<main id="stage" aria-label="OpenPost launch film"></main>
		<script type="module" src="./film.js"></script>
	</body>
</html>
