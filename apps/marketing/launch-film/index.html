<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OpenPost launch film</title>
		<link rel="icon" href="data:," />
		<style>
			@font-face {
				font-family: 'Geist';
				src: url('/assets/brand/fonts/Geist-Regular.ttf');
				font-weight: 400;
			}
			@font-face {
				font-family: 'Geist';
				src: url('/assets/brand/fonts/Geist-SemiBold.ttf');
				font-weight: 600;
			}
			@font-face {
				font-family: 'Manrope';
				src: url('/assets/brand/fonts/Manrope-Variable.ttf');
				font-weight: 200 800;
			}

			:root {
				--canvas: #110d0b;
				--ink: #f6efe9;
				--muted: #a4968c;
				--accent: #fd975d;
				--accent-deep: #c96d32;
				--line: rgb(255 255 255 / 9%);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				background: #000;
			}

			#stage {
				position: relative;
				width: 1920px;
				height: 1080px;
				overflow: hidden;
				background: var(--canvas);
				color: var(--ink);
				font-family: 'Geist', sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			.layer {
				position: absolute;
				inset: 0;
			}

			.abs {
				position: absolute;
				left: 0;
				top: 0;
				transform-origin: 0 0;
				will-change: transform, opacity;
			}

			#glow {
				width: 480px;
				height: 270px;
				transform: scale(4);
				image-rendering: pixelated;
			}

			.headline {
				font-weight: 600;
				font-size: 86px;
				line-height: 1.02;
				letter-spacing: -0.035em;
				white-space: nowrap;
			}

			.headline .word {
				display: inline-block;
				overflow: hidden;
				vertical-align: top;
				padding: 0 0.04em 0.12em;
				margin: 0 -0.04em -0.12em;
			}

			.headline .word > span {
				display: inline-block;
			}

			.headline .accent {
				color: var(--accent);
			}

			.sub {
				font-size: 34px;
				line-height: 1.3;
				color: var(--muted);
				letter-spacing: -0.01em;
			}

			.chapter {
				font-size: 22px;
				font-weight: 600;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--accent);
			}

			.window {
				width: 1440px;
				border-radius: 22px;
				overflow: hidden;
				background: #0c0908;
				border: 1px solid rgb(255 255 255 / 12%);
				box-shadow:
					0 60px 140px rgb(0 0 0 / 60%),
					0 0 0 1px rgb(0 0 0 / 50%);
			}

			.window .bar {
				height: 44px;
				display: flex;
				align-items: center;
				gap: 9px;
				padding: 0 18px;
				background: #1a1411;
				border-bottom: 1px solid var(--line);
			}

			.window .bar i {
				width: 13px;
				height: 13px;
				border-radius: 50%;
				background: #3a302a;
			}

			.window .bar span {
				margin: 0 auto;
				padding: 5px 18px;
				border-radius: 8px;
				background: #110d0b;
				color: var(--muted);
				font-size: 15px;
			}

			.window .viewport {
				position: relative;
				width: 1440px;
				height: 900px;
				overflow: hidden;
			}

			.window .viewport img {
				position: absolute;
				left: 0;
				top: 0;
				width: 1440px;
				transform-origin: 0 0;
			}

			.tile {
				width: 112px;
				height: 112px;
				border-radius: 28px;
				background: #1c1613;
				border: 1px solid rgb(255 255 255 / 10%);
				display: grid;
				place-items: center;
				box-shadow: 0 20px 50px rgb(0 0 0 / 45%);
			}

			.tile img {
				width: 76px;
				height: 76px;
			}

			.chip {
				padding: 12px 22px;
				border-radius: 999px;
				background: #221a16;
				border: 1px solid rgb(255 255 255 / 12%);
				color: var(--ink);
				font-size: 26px;
				font-weight: 600;
				white-space: nowrap;
				box-shadow: 0 16px 40px rgb(0 0 0 / 45%);
			}

			.chip b {
				color: var(--accent);
				font-weight: 600;
			}

			.card {
				width: 624px;
				border-radius: 18px;
				overflow: hidden;
				border: 1px solid rgb(255 255 255 / 14%);
				box-shadow: 0 40px 100px rgb(0 0 0 / 55%);
			}

			.card img {
				display: block;
				width: 624px;
			}

			.badge {
				width: 64px;
				height: 64px;
				border-radius: 18px;
				overflow: hidden;
				box-shadow: 0 12px 30px rgb(0 0 0 / 55%);
			}

			.badge img {
				width: 64px;
				height: 64px;
			}

			.feature {
				width: 300px;
				height: 230px;
				border-radius: 26px;
				background: #19130f;
				border: 1px solid rgb(255 255 255 / 10%);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 22px;
				font-size: 28px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}

			.feature img {
				width: 88px;
				height: 88px;
			}

			.cursor {
				width: 40px;
				height: 40px;
				filter: drop-shadow(0 6px 10px rgb(0 0 0 / 50%));
			}

			.mark path {
				fill: var(--accent);
			}

			.wordmark {
				font-family: 'Manrope', sans-serif;
				font-weight: 600;
				font-size: 150px;
				letter-spacing: -0.04em;
			}

			.url {
				font-size: 60px;
				font-weight: 600;
				color: var(--accent);
				letter-spacing: -0.01em;
			}

			.toast-flash {
				border-radius: 50%;
				background: radial-gradient(circle, rgb(253 151 93 / 55%), transparent 65%);
			}

			.confetti {
				width: 14px;
				height: 8px;
				border-radius: 2px;
			}

			.label {
				position: absolute;
				bottom: 28px;
				right: 40px;
				font-size: 16px;
				color: rgb(255 255 255 / 38%);
			}
		</style>
	</head>
	<body>
		<main id="stage" aria-label="OpenPost launch film"></main>
		<script type="module" src="./film.js"></script>
	</body>
</html>
